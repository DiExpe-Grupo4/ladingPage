<section id="como-funciona" class="relative py-28">
  <div class="diagonal-rule mx-auto max-w-6xl"></div>
  <div class="mx-auto mt-20 max-w-5xl px-6">
    <h2 class="font-display text-5xl sm:text-6xl">
      Cómo <span class="text-primary">funciona</span>
    </h2>
    <ol class="relative mt-14 border-l border-border pl-8">
      @for (step of steps; track step.number; let i = $index) {
        <li
          appScrollReveal
          [scrollRevealDelay]="i * 100"
          (mouseenter)="setActive(i)"
          (focus)="setActive(i)"
          tabindex="0"
          class="relative pb-14 outline-none transition-all duration-300 last:pb-0"
          [class]="i % 2 ? 'md:ml-24' : 'md:ml-0'"
        >
          <span
            class="absolute -left-[41px] top-1 size-4 rotate-45 border transition-colors"
            [class]="active() === i ? 'border-primary bg-primary' : 'border-border bg-background'"
          ></span>
          <p
            class="font-display text-sm tracking-[0.3em]"
            [class]="active() === i ? 'text-primary' : 'text-muted-foreground'"
          >
            Paso {{ step.number }}
          </p>
          <h3
            class="font-display mt-2 text-4xl"
            [class]="active() === i ? 'text-foreground' : 'text-muted-foreground/60'"
          >
            {{ step.title }}
          </h3>
          <p
            class="mt-3 max-w-xl text-sm leading-relaxed"
            [class]="active() === i ? 'text-muted-foreground' : 'text-muted-foreground/45'"
          >
            {{ step.text }}
          </p>
        </li>
      }
    </ol>
  </div>
</section>
