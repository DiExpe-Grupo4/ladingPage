<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-all duration-300"
  [class]="scrolled() ? 'border-primary/20 bg-background/70 backdrop-blur-xl' : 'border-transparent'"
>
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a href="#top" class="flex items-center">
      <img src="images/logoAvisum.png" alt="Avisum" class="h-12 w-auto" />
    </a>
    <ul class="hidden items-center gap-8 md:flex">
      @for (item of nav; track item.href) {
        <li>
          <a
            [href]="item.href"
            class="text-sm font-medium uppercase tracking-widest text-muted-foreground transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
    <div class="flex items-center gap-3">
      <a
        href="#apoyo"
        class="font-display bg-primary px-6 py-2.5 text-base tracking-widest text-primary-foreground transition-transform hover:-translate-y-0.5"
      >
        Ingresar
      </a>
      <app-icon name="menu" [size]="24" class="text-muted-foreground md:hidden" />
    </div>
  </nav>
</header>
