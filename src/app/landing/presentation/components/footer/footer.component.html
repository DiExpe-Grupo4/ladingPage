<footer class="border-t border-border py-12">
  <div class="mx-auto flex max-w-7xl flex-col items-center gap-6 px-6 md:flex-row md:justify-between">
    <img src="images/logoAvisum.png" alt="Avisum" class="h-11 w-auto" />
    <ul class="flex flex-wrap justify-center gap-6">
      @for (item of nav; track item.href) {
        <li>
          <a [href]="item.href" class="text-xs uppercase tracking-widest text-muted-foreground hover:text-primary">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
    <p class="text-xs text-muted-foreground">© {{ year }} Avisum · Lima, Perú</p>
  </div>
</footer>
