<section id="apoyo" class="px-6 py-24">
  <div class="cut-corner mx-auto max-w-6xl border border-primary/40 bg-primary/8 p-12 text-center" appScrollReveal>
    <h2 class="font-display text-5xl sm:text-6xl">
      Solicita una <span class="text-primary">auditoría de seguridad</span> para tu flota
    </h2>
    <p class="mx-auto mt-5 max-w-2xl text-muted-foreground">
      Evaluamos tus rutas críticas, el estado de tus unidades y el tiempo real de respuesta ante
      un incidente. Recibes un informe operativo y una demo del tablero con tu propia flota.
    </p>
    <div class="mt-9 flex flex-wrap justify-center gap-4">
      <a
        [href]="'mailto:' + contactEmail"
        class="font-display bg-primary px-8 py-4 text-lg tracking-widest text-primary-foreground transition-transform hover:-translate-y-0.5"
      >
        Solicitar demo
      </a>
      <a
        [href]="'mailto:' + contactEmail"
        class="font-display border border-border px-8 py-4 text-lg tracking-widest text-foreground transition-colors hover:border-primary hover:text-primary"
      >
        Hablar con operaciones
      </a>
    </div>
  </div>
</section>
